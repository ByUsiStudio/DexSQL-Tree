name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The engine hands one *dex.Container to several goroutines and serves
      # concurrent HTTP requests; a race here would be invisible to go test.
      - name: Race detector
        run: go test -race ./internal/store ./internal/api ./internal/mcp
      # The parser reads attacker-controlled counts. A one-minute run caught an
      # allocation bomb within the first few thousand executions.
      - name: Fuzz the parser
        run: go test ./internal/dex -run=^$ -fuzz=FuzzParseContainer -fuzztime=60s

  # The engine is pure Go, so every target compiles on one Linux runner.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, goarm: "" }
          - { goos: linux,   goarch: arm64, goarm: "" }
          - { goos: linux,   goarch: arm,   goarm: "7" }
          - { goos: darwin,  goarch: amd64, goarm: "" }
          - { goos: darwin,  goarch: arm64, goarm: "" }
          - { goos: windows, goarch: amd64, goarm: "" }
          - { goos: windows, goarch: arm64, goarm: "" }
          - { goos: freebsd, goarch: amd64, goarm: "" }
          - { goos: freebsd, goarch: arm64, goarm: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/dexsql-tree

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build engine for integration tests
        run: |
          mkdir -p bin
          go build -o bin/dexsql-tree ./cmd/dexsql-tree
      - name: Maven package
        working-directory: java
        run: mvn -B -q package
