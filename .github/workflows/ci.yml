name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build engine for integration tests
        run: |
          mkdir -p bin
          go build -o bin/dexsql-tree ./cmd/dexsql-tree
      - name: Maven package
        working-directory: java
        run: mvn -B -q package
